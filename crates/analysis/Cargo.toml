[package]
name = "analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
object = "0.32.1"
symbolic-demangle = "12.4.1"
symbolic-common = "12.4.1"
iced-x86 = "1.20.0"
# DWARF line info. 0.21 is the `addr2line` release that pairs with `object` 0.32 and
# `gimli` 0.28, which is what keeps one `object` and one `gimli` in the tree — check with
# `cargo tree -p analysis -d` after touching either. `default-features = false` drops
# `addr2line`'s own `object`, `memmap2` and demangler dependencies: sections are loaded
# here (see `src/line.rs`), not by `Context::new`, and names are demangled by
# `symbolic-demangle` as they already were. `gimli` is named directly for `Dwarf::load`
# and `EndianArcSlice`, at the same version `addr2line` asks for.
addr2line = { version = "0.21", default-features = false, features = ["std"] }
gimli = { version = "0.28", default-features = false, features = ["read", "std", "endian-reader"] }
# The file digest (`FileDigest`), and no new crate in the build: `object` already pulls
# this exact version in through `ruzstd`, so naming it here compiles nothing extra.
# `default-features = false` keeps it that way — the default `std` feature exists only to
# add `rand` for a randomly seeded hasher, which would be the one crate this does add and
# is the opposite of what a digest compared across runs needs.
twox-hash = { version = "1.6.3", default-features = false }
# PDB line info (`src/line/pdb.rs`). `pdb2` is the maintained fork of `pdb` 0.8 with the
# same API; chosen over `pdb` itself because that one wants `fallible-iterator` 0.2 beside
# the 0.3 `gimli` already brings, and over `pdb-addr2line` because it answers one address at
# a time with no column and would add six crates. This adds exactly one, `scroll`: its
# `fallible-iterator` 0.3 and `uuid` 1 are already in the tree. `cargo tree -p analysis -d`
# reported the same two `hashbrown`s before and after, and nothing else.
pdb2 = "0.10"
# The digests a PDB records per source file (`SourceDigests`), so the app can tell a file it
# opened apart from the one the binary was built from. All three share `digest` 0.10;
# `sha1` and `digest` were already in the lock through the devtools feature's `tungstenite`,
# so the default build gains `md-5`, `sha2` and the `digest` family it did not compile
# before. Hashing lives here and not in the app so it is tested against known vectors
# without a UI in the way.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
# Test fixtures are built in memory with the writers rather than committed as blobs:
# `object` writes the container, `gimli::write` the DWARF inside it. Both are the same
# versions the crate itself depends on, so no second copy enters the tree.
object = { version = "0.32", features = ["write"] }
gimli = { version = "0.28", features = ["write"] }
