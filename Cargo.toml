[package]
name = "viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
freya = { version = "0.4" }
rfd = "0.17"
async-channel = "2"
object = "0.32.1"
symbolic-demangle = "12.4.1"
symbolic-common = "12.4.1"
iced-x86 = "1.20.0"
env_logger = "0.10.0"

[features]
# Opt-in so the devtools server never ends up in a default or release build.
# See `notes/DevTools.md`.
devtools = ["freya/devtools"]

[profile.release]
debug = true
