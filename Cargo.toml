[package]
name = "viewer"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/analysis"]

[dependencies]
analysis = { path = "crates/analysis" }
freya = { version = "0.4" }
rfd = "0.17"
async-channel = "2"
# Still needed by `ui.rs` (`kind_color`); removed in step 1b.
iced-x86 = "1.20.0"
env_logger = "0.10.0"

[features]
# Opt-in so the devtools server never ends up in a default or release build.
# See `notes/DevTools.md`.
devtools = ["freya/devtools"]

[profile.release]
debug = true
