[package]
name = "viewer"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/analysis"]

[dependencies]
analysis = { path = "crates/analysis" }
# `code-editor` is on for two things. The tree-sitter syntax highlighter that crate
# exposes on its own (`SyntaxHighlighter`, `SyntaxBlocks`, `EditorSyntaxTheme`), which is
# what colours the read-only source pane -- that pane's rows are hand-rolled, since
# `CodeEditor` paints a line background only for the cursor's row and keeps its scroll
# state private, and both are things that pane has to do. And `CodeEditor` itself, for the
# scratchpad's editor, where neither of those objections applies and where it brings a
# cursor, a selection, an undo history and an incremental re-parse per keystroke.
# `engine` is an empty feature that only opens `freya::engine`, the re-export of the skia
# bindings freya is built on: the rows ask a laid-out paragraph where a column is
# (`ui/marks.rs`, `caret_x`), and the two rect styles that call takes live nowhere else.
freya = { version = "0.4", features = ["code-editor", "icons-lucide", "engine"] }
# The grammars the highlighter parses with; that crate deliberately ships none. Their
# `tree-sitter-language` must be the one the `tree-sitter` below and `freya-code-editor`'s
# share, or the `Language` handed over is a different type.
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
# The two configuration languages a project directory is full of (`Cargo.toml`, a
# `.cargo/config.toml`, a `package.json`), for the Files view's source tabs. `-ng` is the
# maintained TOML grammar; the original `tree-sitter-toml` stopped at an older ABI.
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
# The parser itself, for the one thing the highlighter's parse cannot be asked afterwards:
# which lines each C or C++ function in a file spans (`src/functions.rs`; Rust has a scanner
# of its own there, the grammar being behind the compiler). `SyntaxHighlighter` keeps its
# tree private, so the file is parsed a second time and the spans are kept. Not a new
# crate in the build: this is the `tree-sitter` already compiled under `freya-code-editor`,
# and the version is pinned to what the lock holds so that there is one copy and the
# grammars' `Language` is the same type on both sides. `cargo tree -d` is how that stays true.
tree-sitter = "0.26"
rfd = "0.17"
# The filter bars' matching engine (`src/filter.rs`), and not a new crate in the build:
# regex 1 is already compiled in this tree, as a dependency of both `env_logger` and the
# `tree-sitter` under freya's syntax highlighter.
regex = "1"
# The source search (`src/search.rs`): ripgrep's own walker and searcher rather than a
# hand-rolled walk and a `regex` over whole files. `ignore` is what reads git's ignore
# files, the whole reason the search skips `target/` without being told to; `grep-searcher`
# reads a file a line at a time, never holding a big one whole, and is what recognises a
# binary; `grep-regex` compiles the pattern for it and `grep-matcher` is the trait the
# matches are asked for through. Unlike most of the list above these really are new
# packages -- eight of them, the four named here plus `globset`, `bstr`, `encoding_rs` and
# `encoding_rs_io` -- but nothing they pull in is a second copy of anything: `memchr`,
# `regex-automata`, `regex-syntax`, `aho-corasick`, `walkdir`, `same-file`, `crossbeam-*`
# and `winapi-util` are all in the lock already and shared. `cargo tree -d` is how that
# stays true.
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
async-channel = "2"
# The timer for the periodic save. Not a new async runtime: freya already depends on
# async-io (freya-animation and freya-sdk both wait on `Timer` inside spawned tasks),
# so this only names what is already linked in and running.
async-io = "2"
env_logger = "0.10.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# Only for `cargo build --message-format=json` (`src/scratchpad.rs`): cargo says where
# it put an artifact and what the compiler said in JSON lines, and parsing them is how
# the scratchpad gets an artifact path it did not have to guess. Not a new crate in the
# build -- serde_json is already compiled in this tree as a build-dependency of
# `freya-skia-bindings`, and every crate it depends on is already in the lock, so this
# adds an edge and no packages. Files this app writes are still TOML, per `AGENTS.md`;
# this is a protocol, not a file.
serde_json = "1"
dirs = "6"
# One call: the sixty-four random bits a project is identified by (`src/project.rs`). It has
# to be random rather than a counter or a hash of the clock, since the id is what says a
# session belongs to the project it sits beside and two projects made on two machines must
# not collide. Not a new crate in the build: getrandom 0.3.4 is already compiled in this
# tree under `ahash` and `rand_core`, so this adds an edge and no packages, and the version
# is the one the lock already holds. `cargo tree -d` is how that stays true.
getrandom = "0.3"
toml = "1.1.4"
# Editing a manifest the app did not write: the Build control offers to turn on debug
# information for a profile (`src/cargo.rs`), and that means changing the reader's own
# `Cargo.toml` in place. `toml` above parses into a value and would write back a file with
# every comment and every blank line gone; `toml_edit` keeps the document, which is the whole
# reason for a second TOML crate. `toml` 1.x is *not* a facade over it -- it has its own
# `toml_parser` and `toml_writer` -- but the version resolved here is already in the lock, as
# `proc-macro-crate`'s dependency under freya's `zbus_macros`. So this adds no package and no
# second version, only a target-side compile of one that was being built for the host anyway.
# `cargo tree -i toml_edit` is how that stays true.
toml_edit = "0.25"

# One call: `kill(-pgid, SIGKILL)`, which ends a scratchpad run's whole process group
# (`src/scratchpad.rs`). Putting the run in a group of its own is std's `process_group`, but
# signalling one is not something std exposes. Target-gated, and not a new crate in the
# build: libc is already compiled in this tree for every unix target, under `dirs-sys` and
# under the `errno`/`rustix` chain beneath freya, so this adds an edge and no packages. The
# version is what the lock already holds; `cargo tree -d` is how that stays true.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows' own font settings, read through `SystemParametersInfo` rather than by shelling
# out to `reg.exe` (`src/fonts.rs`). Target-gated, so the Linux and macOS builds are
# exactly what they were. The version is pinned to what the tree already holds rather than
# to the newest release: the lock has 0.52 (winit, glutin), 0.59 (rustix 0.38) and 0.61
# (rfd, async-io, dirs-sys, rustix 1), all pulled in transitively, so asking for the
# newest of the three turns two features on in a crate that is already being compiled
# instead of adding a fourth copy of it. `cargo tree -d` is how that stays true.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    # `SystemParametersInfoW`, `SPI_GETNONCLIENTMETRICS`, `NONCLIENTMETRICSW`.
    "Win32_UI_WindowsAndMessaging",
    # `LOGFONTW` -- which is also what gates the `NONCLIENTMETRICSW` fields holding one --
    # and the screen DC the metrics' DPI is read off: `GetDC`/`GetDeviceCaps`/`ReleaseDC`.
    "Win32_Graphics_Gdi",
    # The Windows half of a scratchpad run's process group (`src/scratchpad.rs`): a
    # kill-on-close job object the spawned program is assigned to, so that stopping it
    # stops what it started. `CreateJobObjectW`, `SetInformationJobObject` with
    # `JOBOBJECT_EXTENDED_LIMIT_INFORMATION`, and `AssignProcessToJobObject`.
    "Win32_System_JobObjects",
    # Not asked for directly, but the two the above will not compile without: the
    # `SECURITY_ATTRIBUTES` in `CreateJobObjectW`'s signature (which is passed null), and
    # the limit structure itself, which windows-sys gates on Threading. Both are cfgs in a
    # crate already being compiled and neither is a package.
    "Win32_Security",
    "Win32_System_Threading",
] }

[features]
# Opt-in so the devtools server never ends up in a default or release build.
# See `notes/DevTools.md`.
devtools = ["freya/devtools"]

[profile.release]
debug = true

# Only for the one headless UI test in `ui.rs`: a gesture that ends in a `State` write is
# a runtime borrow the compiler is happy with, so it takes freya's own runner to catch.
[dev-dependencies]
freya-testing = "0.4.3"
